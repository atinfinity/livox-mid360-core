# Project site (issue #104). Build with scripts/build-docs.sh, which generates the Doxygen API
# reference into docs/reference/ first; the Docs workflow publishes site/ to GitHub Pages.
site_name: livox-mid360-core
site_description: Clean-room, dependency-free C++ SDK for the Livox Mid-360 LiDAR
site_url: https://atinfinity.github.io/livox-mid360-core/
repo_url: https://github.com/atinfinity/livox-mid360-core
repo_name: atinfinity/livox-mid360-core
edit_uri: ""

# README.md, CONTRIBUTING.md, examples/README.md and tools/README.md are added as pages and
# their GitHub links rewritten by the hooks; see scripts/mkdocs_hooks.py.
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Follow the system setting
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Guides:
      - Simulator: simulator.md
      - LVX2 record / replay: lvx2.md
      - Rerun viewer: rerun.md
      - Debug raw data: debug_data.md
  - Design:
      - Architecture: architecture.md
      - API design: api.md
      - Session layer: session.md
      - Transport layer: transport.md
      - Protocol notes: protocol_notes.md
  - API reference: reference/index.html
  - Examples: examples.md
  - Tools: tools.md
  - Project:
      - Roadmap: roadmap.md
      - Contributing: contributing.md
