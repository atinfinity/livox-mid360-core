name: Coverage

on:
  push:
    branches: [main]
    # Documentation-only changes skip this workflow (issue #59); see the note in ci.yml.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  coverage:
    name: gcc-14 / gcovr
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build catch2 gcovr
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DLIVOX_MID360_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Report
        run: |
          mkdir -p coverage/html
          gcovr --root . --gcov-executable gcov-14 --txt-metric branch \
            --filter 'src/.*' --filter 'include/livox/mid360/.*' \
            --exclude 'tests/.*' --exclude 'build/.*' \
            --cobertura coverage/coverage.xml --cobertura-pretty \
            --html-details coverage/html/index.html \
            --print-summary
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          retention-days: 14
      - name: Upload to Codecov
        # Needs CODECOV_TOKEN, which fork PRs cannot read.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.xml
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
