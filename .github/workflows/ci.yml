name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes skip this workflow (issue #59). Keep this list identical in
    # ci.yml, lint.yml and coverage.yml. If required status checks are ever enabled on main,
    # switch to an always-running gate job instead, or docs PRs will be stuck on "Expected".
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.git-blame-ignore-revs'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.git-blame-ignore-revs'

# Every job sets timeout-minutes to about 3x its usual run time, so a hung step fails
# instead of holding the runner for GitHub's default of 360 minutes (issue #186).
jobs:
  build-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.build_type }}${{ matrix.sanitize && ' / ASan+UBSan' || '' }}${{ matrix.tsan && ' / TSan' || '' }}${{ matrix.os == 'ubuntu-24.04-arm' && ' / arm64' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler:
          - { name: gcc-13, cc: gcc-13, cxx: g++-13, apt: g++-13 }
          - { name: gcc-14, cc: gcc-14, cxx: g++-14, apt: g++-14 }
          - { name: clang-19, cc: clang-19, cxx: clang++-19, apt: "clang-19 libclang-rt-19-dev" }
        build_type: [Release]
        sanitize: [false]
        tsan: [false]
        include:
          # ThreadSanitizer (issue #42): the logging handler swap and the receive / worker
          # thread hand-offs. Release keeps the simulator-driven tests fast enough.
          - os: ubuntu-24.04
            compiler: { name: clang-19, cc: clang-19, cxx: clang++-19, apt: "clang-19 libclang-rt-19-dev" }
            build_type: Release
            sanitize: false
            tsan: true
          - os: ubuntu-24.04
            compiler: { name: gcc-14, cc: gcc-14, cxx: g++-14, apt: g++-14 }
            build_type: Debug
            sanitize: true
          - os: ubuntu-24.04
            compiler: { name: clang-19, cc: clang-19, cxx: clang++-19, apt: "clang-19 libclang-rt-19-dev" }
            build_type: Debug
            sanitize: true
          # arm64 (native GitHub-hosted runners, issue #19)
          - os: ubuntu-24.04-arm
            compiler: { name: gcc-14, cc: gcc-14, cxx: g++-14, apt: g++-14 }
            build_type: Release
            sanitize: false
          - os: ubuntu-24.04-arm
            compiler: { name: clang-19, cc: clang-19, cxx: clang++-19, apt: "clang-19 libclang-rt-19-dev" }
            build_type: Release
            sanitize: false
          - os: ubuntu-24.04-arm
            compiler: { name: gcc-14, cc: gcc-14, cxx: g++-14, apt: g++-14 }
            build_type: Debug
            sanitize: true
          - os: ubuntu-24.04-arm
            compiler: { name: clang-19, cc: clang-19, cxx: clang++-19, apt: "clang-19 libclang-rt-19-dev" }
            build_type: Debug
            sanitize: true
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: scripts/ci-apt-install.sh ${{ matrix.compiler.apt }} cmake ninja-build catch2
      - name: Configure
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLIVOX_MID360_ENABLE_ASAN=${{ matrix.sanitize && 'ON' || 'OFF' }}
          -DLIVOX_MID360_ENABLE_UBSAN=${{ matrix.sanitize && 'ON' || 'OFF' }}
          -DLIVOX_MID360_ENABLE_TSAN=${{ matrix.tsan && 'ON' || 'OFF' }}
      - name: Lower ASLR entropy for TSan
        if: matrix.tsan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install (smoke)
        run: cmake --install build --prefix "$PWD/_install" && ls -R _install/include/livox

  # macOS is a development platform only (docs/roadmap.md), but Apple libc++ lacks parts of
  # libstdc++'s C++23 (std::atomic<std::shared_ptr>, transitive includes): build and test it so
  # that the README's claim stays true (issue #129).
  macos:
    name: Apple Clang / Release / macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install ninja catch2
      - name: Loopback alias for the multi-device tests
        run: sudo ifconfig lo0 alias 127.0.0.2
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  golden-vectors-in-sync:
    name: Python reference & golden vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and diff
        run: |
          python3 tools/gen_golden_vectors.py
          python3 tools/gen_fuzz_corpus.py
          python3 tools/gen_replay_pcap.py
          git diff --exit-code -- tests/generated/golden_vectors.hpp tests/fuzz/corpus tests/data/replay.pcap
          test -z "$(git status --porcelain -- tests/fuzz/corpus)"
      - name: Simulator unit tests
        run: python3 -m unittest -v tools/test_sim.py

  fuzz-smoke:
    name: libFuzzer smoke (clang-19)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: scripts/ci-apt-install.sh clang-19 libclang-rt-19-dev cmake ninja-build
      - name: Configure
        env: { CC: clang-19, CXX: clang++-19 }
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DLIVOX_MID360_BUILD_FUZZERS=ON -DLIVOX_MID360_ENABLE_ASAN=ON -DLIVOX_MID360_ENABLE_UBSAN=ON
      - name: Build fuzzers
        run: cmake --build build --target fuzzers
      - name: Run each fuzzer briefly
        run: scripts/fuzz.sh build 30

  # livox-mid360-rerun (issue #147) is opt-in because it fetches the Rerun C++ SDK and builds
  # Apache Arrow; build it and run its ctest on one configuration only.
  rerun:
    name: Rerun viewer tool (gcc-14)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: scripts/ci-apt-install.sh g++-14 cmake ninja-build
      - name: Configure
        env: { CC: gcc-14, CXX: g++-14 }
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIVOX_MID360_BUILD_RERUN=ON
      - name: Build
        run: cmake --build build --target livox-mid360-rerun
      - name: Test
        run: ctest --test-dir build --output-on-failure -R '^rerun_'
