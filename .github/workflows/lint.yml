name: Lint

on:
  push:
    branches: [main]
    # Documentation-only changes skip this workflow (issue #59); see the note in ci.yml.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.git-blame-ignore-revs'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.git-blame-ignore-revs'

env:
  RUFF_VERSION: 0.16.9
  AMENT_LINT_BRANCH: jazzy  # ROS 2 distribution whose ament_lint tools are used (#65)

# Every job sets timeout-minutes to about 3x its usual run time, so a hung step fails
# instead of holding the runner for GitHub's default of 360 minutes (issue #186).
jobs:
  clang-format:
    name: clang-format (19)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-apt-install.sh clang-format-19
      - run: git ls-files 'include/*.hpp' 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp' | grep -v '^tests/generated/' | xargs clang-format-19 --dry-run --Werror

  clang-tidy:
    name: clang-tidy (19)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-apt-install.sh clang-19 clang-tidy-19 cmake ninja-build catch2
      - name: Configure (compile_commands.json)
        env: { CC: clang-19, CXX: clang++-19 }
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - run: cmake --build build --target mid360_core
      - run: run-clang-tidy-19 -p build -quiet $(git ls-files 'src/*.cpp' 'tests/test_*.cpp')

  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # setup-uv publishes no major-version tags since v8, so pin the release (as in docs.yml).
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx "ruff@${RUFF_VERSION}" check tools/ scripts/
      - run: uvx "ruff@${RUFF_VERSION}" format --check tools/ scripts/

  # The ROS 2 (ament_lint_common) checks that are cheap and useful on a plain CMake library:
  # cppcheck and lint_cmake. See CONTRIBUTING.md (Lint) and issue #65 for what is left out.
  ament:
    name: ament_cppcheck / ament_lint_cmake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-apt-install.sh cppcheck
      - uses: astral-sh/setup-uv@v10.2.0
      - run: |
          for tool in ament_cppcheck ament_lint_cmake; do
            uv tool install "${tool} @ git+https://github.com/ament/ament_lint.git@${AMENT_LINT_BRANCH}#subdirectory=${tool}"
          done
          uv tool dir --bin >> "$GITHUB_PATH"
      - run: scripts/lint.sh --ament-only
