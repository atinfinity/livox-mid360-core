# Project site (issues #104, #185). Build with scripts/build-docs.sh: it generates the Doxygen
# API reference into docs/reference/, stages docs/ and the READMEs into site-src/ with
# scripts/stage_docs.py, then runs Zensical; the Docs workflow publishes site/ to GitHub Pages.
[project]
site_name = "livox-mid360-core"
site_description = "Clean-room, dependency-free C++ SDK for the Livox Mid-360 LiDAR"
site_url = "https://atinfinity.github.io/livox-mid360-core/"
repo_url = "https://github.com/atinfinity/livox-mid360-core"
repo_name = "atinfinity/livox-mid360-core"
edit_uri = ""
# Written by scripts/stage_docs.py from docs/, README.md, CONTRIBUTING.md, examples/README.md
# and tools/README.md; edit those, not site-src/.
docs_dir = "site-src"
site_dir = "site"

# A new page in docs/ needs an entry here; a new root README also needs one in ROOT_PAGES of
# scripts/stage_docs.py.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting_started.md" },
  { "Guides" = [
    { "Simulator" = "simulator.md" },
    { "LVX2 record / replay" = "lvx2.md" },
    { "Rerun viewer" = "rerun.md" },
    { "Debug raw data" = "debug_data.md" },
  ] },
  { "Design" = [
    { "Architecture" = "architecture.md" },
    { "API design" = "api.md" },
    { "Session layer" = "session.md" },
    { "Transport layer" = "transport.md" },
    { "Protocol notes" = "protocol_notes.md" },
  ] },
  { "API reference" = "reference/index.html" },
  { "Examples" = "examples.md" },
  { "Tools" = "tools.md" },
  { "Project" = [
    { "Roadmap" = "roadmap.md" },
    { "Contributing" = "contributing.md" },
  ] },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Follow the system setting"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.highlight"]
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
