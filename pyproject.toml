# Python tooling for tools/. Shared with livox-mid360-ros2 (issue #17):
# line-length 99 matches ament_flake8's default, pep257 matches ament_pep257.
[tool.ruff]
line-length = 99
target-version = "py310"
extend-exclude = ["build*", "_install"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "D"]
ignore = [
  "D1",   # missing docstrings: not enforced (tests, small helpers)
  "D203", # one-blank-line-before-class (conflicts with D211)
  "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
